{% extends "templates/stop_pending.html" %}

{% block main %}

<div class="container">
  <div style="background: url({{ static_url("external/images/spawn_back.png") }}) no-repeat center center; background-size: auto 100%; height: 250px;"></div>
  <div class="row">
    <div class="text-center">
      {% block message %}
        <p>Your server is stopping.</p>
        <p>You will be able to start it again once it has finished stopping.</p>
      {% endblock message %}
      <p><i class="fa fa-spinner fa-pulse fa-fw fa-3x" aria-hidden="true"></i></p>
      <a role="button" id="refresh" class="btn btn-lg btn-primary" href="#">refresh</a>
    </div>
  </div>
</div>

{% endblock %}
